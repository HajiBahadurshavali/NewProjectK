<div class="container mt-4">

  <!-- 🔍 Search Bar -->
  <div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">

      <div class="input-group shadow rounded-pill overflow-hidden">

        <span class="input-group-text bg-white border-0">
          🔍
        </span>

        <input
          type="text"
          class="form-control border-0"
          [(ngModel)]="query"
          (keyup)="onSearch()"
          placeholder="Search for sarees, designs..."
        />

      </div>

    </div>
  </div>

  <!-- 📦 Results -->
  <div class="row mt-4">

    <div class="col-md-4 col-sm-6 mb-4" *ngFor="let p of products">

      <div class="card h-100 shadow-sm product-card">

        <div class="card-body text-center">

          <h5 class="card-title">{{p.name}}</h5>
          <p class="text-muted">{{p.category}}</p>

          <h6 class="text-success">₹{{p.price}}</h6>

        </div>

      </div>

    </div>

  </div>

</div>
